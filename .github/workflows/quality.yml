# ЛР 14, Результат 4: «gate» якості сховища. Зараз запускає лише офлайн-тести каркаса;
# перевірки SHACL/SPARQL/JSON Schema/pytest додаються в lab-14/quality/tests/.
name: quality
on:
  push:
    paths: ["lab-14/**", ".github/workflows/quality.yml"]
  pull_request:
    paths: ["lab-14/**", ".github/workflows/quality.yml"]
jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lab-14/requirements-ci.txt
      - run: pip install -r requirements-ci.txt
      - run: python -m pytest quality/tests -q
