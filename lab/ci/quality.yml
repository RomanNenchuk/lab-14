# ЛР 14, Результат 4: автоматичний gate якості сховища знань.
# ВСТАНОВЛЕННЯ: скопіюй цей файл у КОРІНЬ репозиторію: <репозиторій>/.github/workflows/quality.yml
# (шляхи нижче розраховані на структуру lab-14/lab/ усередині репозиторію).
name: quality
on:
  push:
    paths: ["lab-14/**", ".github/workflows/quality.yml"]
  pull_request:
    paths: ["lab-14/**", ".github/workflows/quality.yml"]
  workflow_dispatch:
jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lab-14/lab
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: lab-14/lab/requirements-ci.txt
      - run: pip install -r requirements-ci.txt

      - name: Тести (pytest: 20 перевірок gate на еталоні lab11 + виявлення дефектів + dedup/merge/conflicts)
        run: python -m pytest quality/tests -q

      - name: Gate на еталонному сховищі lab11 (блокує при будь-якому порушенні)
        run: python -m quality.gate --variant lab11 --no-history

      - name: Демонстрація — 3 навмисні дефекти мають бути виявлені
        run: python -m quality.ci_demo

      - name: Контроль — baseline-v2 (з синтетичними дефектами) має блокуватися
        run: "! python -m quality.gate --variant baseline --no-history"

      - name: Gate на clean (стане блокуючим після Результату 5; поки лише інформує)
        if: ${{ hashFiles('lab-14/lab/data/clean/**') != '' }}
        continue-on-error: true
        run: python -m quality.gate --variant clean --no-history

      - name: Звіти як артефакти
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: quality-reports
          path: |
            lab-14/lab/quality/ci_report.md
            lab-14/lab/quality/ci_demo.md
